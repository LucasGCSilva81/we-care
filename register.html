<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We care | Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

    <header class="site-header">
        <a class="brand" href="index.html">We Care <span>Studio</span></a>
        <a class="button-secondary" href="index.html">←Return to the website</a>
    </header>
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-symbol">✳</div>

            <span class="eyebrow">JOIN US</span>
            <h1>Create your account</h1>
            <p>Enter your details to begin your experience.</p>

            <form id="register-form" class="auth-form">
                <input id="register-name" name="name" type="text" autocomplete="name"
                    placeholder="Enter your details to begin your experience." required minlength="2" maxlength="8">

                <label for="register-email">E-mail</label>
                <input id="register-email" name="email" type="email" autocomplete="email" placeholder="you@example.com"
                    required>

                <label for="register-password">Create your password</label>
                <input id="register-password" name="password" type="password" autocomplete="new-password"
                    placeholder="Minimum of 8 characters" required minlength="8">

                <label for="register-confirm">Confirm your password</label>
                <input id="register-confirm" name="confirm" type="password" autocorrect="new-password"
                    placeholder="Enter the password again" required minlength="8">

                <button class="button-main" type="submit">Create my account ↗</button>
                <p id="register-feedback" class="form-feedback" role="status"></p>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>
        </section>
    </main>

    <div class="chatbot">

        <button class="chatbot-toggle" id="chatbot-toggle" type="button" aria-label="Open virtual assistant"
            aria-expanded="false" aria-controls="chatbot-window">💬</button>

        <section class="chatbot-window" id="chatbot-window" aria-label="We Care Studio virtual assistant" hidden>

            <header class="chatbot-header">

                <div>

                    <span class="chatbot-status"></span>
                    <h2>We Care Assistant</h2>
                    <p>How can I help you today?</p>

                </div>

                <button class="chatbot-close" id="chatbot-close" type="button" aria-label="Close assistant">
                    &times;
                </button>
                
            </header>

            <div class="chatbot-messages" id="chatbot-messages" aria-live="polite">
                <div class="chtbot-message bot-message">
                    Hi! Welcome to We Care Studio.
                    How can I help you today?
                </div>
            </div>

            <div class="chatbot-options">
                <button type="button" data-question="about">
                    About us
                </button>

                <button type="button" data-question="products">
                    Products
                </button>

                <button type="button" data-question="account">
                    My account
                </button>

                <button type="button" data-question="contact">
                    Contact
                </button>
            </div>

            <form class="chatbot-form" id="chatbot-form">
                <label class="sr-only" for="chatbot-input"></label>
                <input type="text" id="chatbot-input" placeholder="Type your question..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </section>
    </div>

    <script src="./js/script.js"></script>
    <script src="./js/assistant.js"></script>

</body>

</html>
